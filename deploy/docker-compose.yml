version: "3.9"
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: flowctl
      POSTGRES_USER: flowctl
      POSTGRES_PASSWORD: flowctl
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowctl"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.server
    command: ["goose", "-dir", "/migrations", "postgres", "postgres://flowctl:flowctl@postgres:5432/flowctl?sslmode=disable", "up"]
    depends_on:
      postgres:
        condition: service_healthy

  server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.server
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://flowctl:flowctl@postgres:5432/flowctl?sslmode=disable
      SCHEDULER_ENABLED: "true"
      SCHEDULER_NODE_ID: server-1
      JWT_SECRET: dev-secret-do-not-use-in-production
      ENCRYPTION_MASTER_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.worker
    environment:
      DATABASE_URL: postgres://flowctl:flowctl@postgres:5432/flowctl?sslmode=disable
      SCHEDULER_NODE_ID: worker-1
      ENCRYPTION_MASTER_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  frontend:
    build:
      context: ../web
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: http://localhost:8080
    depends_on:
      - server

volumes:
  pgdata:
