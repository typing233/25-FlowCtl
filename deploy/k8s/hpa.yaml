apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: flowctl-server-hpa
  namespace: flowctl
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: flowctl-server
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: flowctl-worker-hpa
  namespace: flowctl
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: flowctl-worker
  minReplicas: 2
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
