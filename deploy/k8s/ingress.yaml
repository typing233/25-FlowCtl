apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: flowctl-ingress
  namespace: flowctl
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/websocket-services: flowctl-server-svc
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - flowctl.example.com
      secretName: flowctl-tls
  rules:
    - host: flowctl.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: flowctl-server-svc
                port:
                  number: 8080
          - path: /auth
            pathType: Prefix
            backend:
              service:
                name: flowctl-server-svc
                port:
                  number: 8080
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: flowctl-server-svc
                port:
                  number: 8080
          - path: /health
            pathType: Exact
            backend:
              service:
                name: flowctl-server-svc
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: flowctl-frontend-svc
                port:
                  number: 80
