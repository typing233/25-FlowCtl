apiVersion: v1
kind: Service
metadata:
  name: flowctl-server-svc
  namespace: flowctl
spec:
  selector:
    app: flowctl-server
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: flowctl-frontend-svc
  namespace: flowctl
spec:
  selector:
    app: flowctl-frontend
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
  type: ClusterIP
