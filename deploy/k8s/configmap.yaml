apiVersion: v1
kind: ConfigMap
metadata:
  name: flowctl-config
  namespace: flowctl
data:
  SERVER_HOST: "0.0.0.0"
  SERVER_PORT: "8080"
  DB_MAX_CONNS: "25"
  DB_MIN_CONNS: "5"
  SCHEDULER_ENABLED: "true"
---
apiVersion: v1
kind: Secret
metadata:
  name: flowctl-secrets
  namespace: flowctl
type: Opaque
stringData:
  DATABASE_URL: "postgres://flowctl:CHANGEME@postgres-svc:5432/flowctl?sslmode=require"
  JWT_SECRET: "CHANGE-THIS-IN-PRODUCTION"
  ENCRYPTION_MASTER_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
  OIDC_CLIENT_SECRET: ""
