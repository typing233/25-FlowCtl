apiVersion: batch/v1
kind: Job
metadata:
  name: flowctl-migrate
  namespace: flowctl
spec:
  template:
    spec:
      containers:
        - name: migrate
          image: flowctl/server:latest
          command: ["goose", "-dir", "/migrations", "postgres"]
          args: ["$(DATABASE_URL)", "up"]
          envFrom:
            - secretRef:
                name: flowctl-secrets
      restartPolicy: OnFailure
  backoffLimit: 3
